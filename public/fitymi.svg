<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full drop-shadow-xl">
  <defs>
    <!-- Background Gradient (Ice Blue -> Steel Blue -> Deep Navy) -->
    <linearGradient id="paletteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8CCE4" />
      <stop offset="55%" stop-color="#3D5A80" />
      <stop offset="100%" stop-color="#19325C" />
    </linearGradient>

    <!-- Front Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F7FB" />
    </linearGradient>

    <!-- Peach Glow Gradient -->
    <linearGradient id="peachGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCEBE6" />
      <stop offset="100%" stop-color="#E8B4A6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#19325C" flood-opacity="0.3" />
    </filter>
    
    <filter id="peachShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#E8B4A6" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base Plate -->
  <rect width="512" height="512" rx="128" fill="url(#paletteBg)" filter="url(#shadow)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="6" />

  <!-- Background Abstract Floating Circles -->
  <circle cx="120" cy="120" r="90" fill="#8CA4C8" opacity="0.25" />
  <circle cx="410" cy="400" r="110" fill="#19325C" opacity="0.4" />

  <!-- Back Tilted Card (Muted Blue Shadow Card) -->
  <rect x="160" y="110" width="220" height="290" rx="28" fill="#3D5A80" transform="rotate(12, 270, 255)" opacity="0.9" />

  <!-- Main Front Card -->
  <rect x="146" y="110" width="220" height="290" rx="28" fill="url(#cardGrad)" filter="url(#shadow)" transform="rotate(-6, 256, 255)" />

  <!-- Glitch Mask Elements Group (Tilted to match front card) -->
  <g transform="rotate(-6, 256, 255)">
    <!-- Top Status Pill (Soft Peach Accent) -->
    <rect x="180" y="145" width="152" height="24" rx="12" fill="#FCEBE6" />
    <rect x="210" y="152" width="92" height="10" rx="5" fill="#E8B4A6" />

    <!-- Sharp Mask Block across Card (Deep Navy) -->
    <path d="M 160 210 Q 256 195 352 210 L 352 280 Q 256 295 160 280 Z" fill="#19325C" />

    <!-- Glowing Angled Eyes (Soft Peach) -->
    <path d="M 185 245 L 225 235 L 225 255 Z" fill="url(#peachGlow)" filter="url(#peachShadow)" />
    <path d="M 327 245 L 287 235 L 287 255 Z" fill="url(#peachGlow)" filter="url(#peachShadow)" />

    <!-- Unknown / Imposter Question Mark (Peach Accent) -->
    <text x="256" y="362" font-family="'Inter', sans-serif" font-weight="900" font-size="48" fill="#E8B4A6" text-anchor="middle">?</text>
  </g>
</svg>
